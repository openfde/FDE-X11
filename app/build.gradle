apply plugin: 'com.android.application'
//apply plugin: 'com.tencent.matrix-plugin'

android {
    namespace 'com.fde.x11'
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.fde.x11"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 162
        versionName "1.6.2"
        buildConfigField "String", "COMMIT", "\"" + ("git rev-parse HEAD\n".execute().getText().trim() ?: (System.getenv('CURRENT_COMMIT') ?: "NO_COMMIT")) + "\""
        manifestPlaceholders = [MainActivityMinHeight: "50dp",
                                MainActivityMinWidth: "50dp",
                                MainDialogMinHeight: "50dp",
                                MainDialogMinWidth: "50dp"]
        externalNativeBuild {
            cmake {
                arguments "-DAPP_LOG=1"
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def project = "fdex11"
            def separator = "-"
            def buildType = variant.buildType.name
            def version = variant.versionName

            // 获取 ABI 名称
            def abi = output.getFilter(com.android.build.OutputFile.ABI)

            def newApkName

            if (abi != null) {
                newApkName =
                        "${project}${separator}${buildType}${separator}${abi}${separator}${version}.apk"
            } else {
                // universal apk
                newApkName =
                        "${project}${separator}${buildType}${separator}universal${separator}${version}.apk"
            }

            output.outputFileName = newApkName
        }
    }


    signingConfigs {
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('plugin.keystore')
            storePassword 'android'
        }

        release {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('plugin.keystore')
            storePassword 'android'
        }
    }


    splits.abi {
        enable true
        reset()

        include "arm64-v8a",'x86_64'
        universalApk true
    }

    buildFeatures {
        viewBinding = true
    }

    lintOptions {
        disable "Instantiatable"
    }

    externalNativeBuild.cmake.path "src/main/cpp/CMakeLists.txt"
//    packagingOptions.jniLibs.useLegacyPackaging false
    buildFeatures.aidl true
    buildFeatures.buildConfig true
    buildTypes {
        release {
            signingConfig signingConfigs.release
            externalNativeBuild {
                cmake {
                    arguments "-DAPP_LOG=0" // Debug模式开启日志
                }
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DAPP_LOG=1" // Debug模式开启日志
                }
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "systemv"

    productFlavors {
        versionu {
            dimension "systemv"
            buildConfigField "String", "system_verstion", "\"versionu\""
        }

        versionr {
            dimension "systemv"
            buildConfigField "String", "system_verstion", "\"versionr\""
        }

        versionc {
            dimension "systemv"
            buildConfigField "String", "system_verstion", "\"versionc\""
        }
    }

    sourceSets {
        versionu.java.srcDirs = ['src/versionu/java']
        versionr.java.srcDirs = ['src/versionr/java']
        versionc.java.srcDirs = ['src/versionc/java']
    }


}

// app/libs/<flavor>/framework.jar is put on the javac boot class path. javac
// refuses to read class files newer than the JDK it runs on and then reports a
// wall of "class file has wrong version 65.0, should be 61.0" errors, so check
// the jar against the JDK running Gradle and fail with one actionable line.
// (libs/versionc/framework.jar is built by a JDK 21 toolchain: class file 65.0.)
def frameworkJarClassFileVersions = [:]
def maxClassFileVersion = { File jar ->
    def key = jar.absolutePath
    if (!frameworkJarClassFileVersions.containsKey(key)) {
        int maxVersion = 0
        if (jar.exists()) {
            def zip = new java.util.zip.ZipFile(jar)
            try {
                for (def entry : zip.entries()) {
                    if (!entry.name.endsWith('.class')) {
                        continue
                    }
                    def stream = zip.getInputStream(entry)
                    try {
                        byte[] header = new byte[8]
                        int read = 0
                        while (read < header.length) {
                            int n = stream.read(header, read, header.length - read)
                            if (n < 0) {
                                break
                            }
                            read += n
                        }
                        if (read == header.length) {
                            int version = ((header[6] & 0xFF) << 8) | (header[7] & 0xFF)
                            if (version > maxVersion) {
                                maxVersion = version
                            }
                        }
                    } finally {
                        stream.close()
                    }
                }
            } finally {
                zip.close()
            }
        }
        frameworkJarClassFileVersions[key] = maxVersion
    }
    frameworkJarClassFileVersions[key]
}

android.applicationVariants.all { variant ->
    variant.javaCompileProvider.configure { javaCompile ->
        def flavorName = variant.flavorName
        def frameworkJar = file("libs/${flavorName}/framework.jar")

        // 更新 bootstrapClasspath
        def originalBootstrap = javaCompile.options.bootstrapClasspath?.files ?: [] as Set
        javaCompile.options.bootstrapClasspath = files(frameworkJar) + files(originalBootstrap)

        // Class file major version = java version + 44 (Java 8 -> 52, 17 -> 61,
        // 21 -> 65). 65 is the newest version any flavor ships, so a newer JDK
        // never has to look at the jar.
        def jdkClassFileVersion = (JavaVersion.current().majorVersion as int) + 44
        if (jdkClassFileVersion < 65) {
            def jarClassFileVersion = maxClassFileVersion(frameworkJar)
            if (jarClassFileVersion > jdkClassFileVersion) {
                throw new GradleException("app/libs/${flavorName}/framework.jar contains Java " +
                        "${jarClassFileVersion - 44} class files (${jarClassFileVersion}.0) but Gradle is " +
                        "running on Java ${JavaVersion.current().majorVersion}, which only reads up to " +
                        "${jdkClassFileVersion}.0. Run the build with a JDK ${jarClassFileVersion - 44}+ " +
                        "(JAVA_HOME, org.gradle.java.home, or Android Studio's Gradle JDK).")
            }
        }
    }
}

dependencies {
    compileOnly fileTree(include: ['*.jar'], dir: 'libs/compile')
    implementation fileTree(include: ['*.jar'], dir: 'libs/impl')
    versionuCompileOnly files('libs/versionu/framework.jar')
    versionrCompileOnly files('libs/versionr/framework.jar')
    versionrCompileOnly files('libs/versionc/framework.jar')

    compileOnly files('libs/openfde_sdk.jar')

//    compileOnly files('libs/framework.jar')
    //noinspection DifferentStdlibGradleVersion
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.xwdz:okHttpUtils:1.3.0'
    implementation 'com.squareup.okhttp3:okhttp:3.5.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'io.github.razerdp:BasePopup:3.2.1'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.github.ChickenHook:RestrictionBypass:2.2'

    implementation project(':x_recyclerview')
    implementation project(':fusionwindowmanager')
    implementation project(':dialogtiplib')
    implementation project(':easy')

//    debugImplementation ("com.squareup.leakcanary:leakcanary-android:2.5")
}
